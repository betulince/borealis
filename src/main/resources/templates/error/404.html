<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
    <main>
        <section class="section">
            <div class="container">
                <div class="error-page">
                    <h1 class="error-title">404</h1>
                    <h2 class="error-subtitle">Page Not Found</h2>
                    <p class="error-message" th:text="${message != null ? message : 'The page you are looking for does not exist.'}">
                        The page you are looking for does not exist.
                    </p>
                    <a th:href="@{/}" class="btn btn-primary">Go Home →</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
